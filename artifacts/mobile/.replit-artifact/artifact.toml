kind = "mobile"
previewPath = "/mobile/"
title = "Camel Mobility"
description = "A native mobile companion for the Camel Mobility EV charging wallet. Lets customers check their wallet balance, view transaction history, and manage their account — all from their phone while standing at a charging station."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
