openapi: 3.1.0

info:
  title: Camel Mobility Wallet API
  description: |
    ## Module 1 — Enterprise Foundation, Identity & Access Management

    This specification covers **only** the APIs implemented in Module 1.
    Future domain APIs (Wallet, Charging Sessions, NFC, Stations) are added
    when those modules are implemented.

    ### Conventions
    - All endpoints are versioned under `/api/v1/`
    - Authentication uses JWT Bearer tokens
    - Error responses follow a consistent contract
    - Correlation IDs (`X-Correlation-ID`) are included in every response
  version: 1.0.0
  contact:
    name: Camel Mobility

servers:
  - url: /api
    description: API root (reverse-proxied)

security:
  - BearerAuth: []

tags:
  - name: health
    description: Platform health and operational status
  - name: system
    description: System information
  - name: auth
    description: Authentication, registration, and password management
  - name: users
    description: User identity and account management (admin)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /v1/auth/login

  schemas:
    # ── Errors ────────────────────────────────────────────────────────────────
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Enter a valid email address

    ApiErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed
        error:
          type: string
          example: Bad Request
        correlationId:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'

    # ── Health / System ───────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          example: ok

    SystemInfo:
      type: object
      required: [version, environment, timestamp, uptime]
      properties:
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: development
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          description: Process uptime in seconds
          example: 3600.5

    # ── User / Identity ───────────────────────────────────────────────────────
    UserRole:
      type: string
      enum:
        - CUSTOMER
        - ADMIN_OFFICER
        - SUPER_ADMIN
        - OPERATIONS
        - SUPPORT
        - FINANCE
        - TECHNICAL
        - DEVELOPER

    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DEACTIVATED]

    UserProfile:
      type: object
      required: [id, firstName, lastName, email, phone, role, status, registrationSource, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: clxyz123abc
        firstName:
          type: string
          example: Amara
        lastName:
          type: string
          example: Okonkwo
        email:
          type: string
          format: email
          example: amara@example.com
        phone:
          type: string
          example: '+2348012345678'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        registrationSource:
          type: string
          example: SELF_REGISTER
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, phone, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Amara
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Okonkwo
        email:
          type: string
          format: email
          example: amara@example.com
        phone:
          type: string
          example: '+2348012345678'
        password:
          type: string
          minLength: 8
          format: password

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token (15 minutes)
        refreshToken:
          type: string
          description: Opaque long-lived refresh token (7 days)
        expiresIn:
          type: integer
          description: Access token TTL in seconds
          example: 900
        tokenType:
          type: string
          enum: [Bearer]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: amara@example.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/AuthTokens'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmBody:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 8

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      summary: Platform health check
      description: Returns platform health status. Used by load balancers and monitoring.
      tags: [health]
      security: []
      responses:
        '200':
          description: Platform is healthy
          headers:
            X-Correlation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Platform is degraded or down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ── System ──────────────────────────────────────────────────────────────────
  /v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Platform version and system information
      tags: [system]
      security: []
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'

  # ── Auth — Registration ──────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      operationId: register
      summary: Customer self-registration
      description: |
        Creates a new customer account with PENDING status.
        The account must be activated by an administrator before login is permitted.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully (pending activation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Email or phone number already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Login ──────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: |
        Returns access and refresh tokens on success.
        Account must have ACTIVE status.
        Rate limited: 10 attempts per 15 minutes per IP.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Account not active or locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Logout ─────────────────────────────────────────────────────────────
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      description: Revokes the provided refresh token. The access token expires naturally.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Refresh ───────────────────────────────────────────────────────────
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate refresh token and obtain new access token
      description: |
        Exchanges a valid refresh token for a new token pair.
        The old refresh token is immediately revoked (token rotation).
        Presenting a previously revoked token triggers family-wide revocation (theft detection).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Me ────────────────────────────────────────────────────────────────
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user profile
      tags: [auth]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Password Change ───────────────────────────────────────────────────
  /v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change authenticated user password
      description: Requires current password verification. All refresh tokens are revoked on success.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Auth — Password Reset ─────────────────────────────────────────────────────
  /v1/auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset token
      description: |
        Sends a password reset token to the user's email address.
        Always returns 200 regardless of whether the email exists
        (prevents email enumeration).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestBody'
      responses:
        '200':
          description: Reset instructions sent (if account exists)

  /v1/auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Complete password reset with token
      description: Verifies the reset token and updates the password. Token is single-use.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmBody'
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  # ── Users (Admin) ─────────────────────────────────────────────────────────────
  /v1/users:
    get:
      operationId: listUsers
      summary: List users (Admin)
      description: Paginated list of all users. Requires ADMIN_OFFICER or SUPER_ADMIN role.
      tags: [users]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: search
          in: query
          description: Search by name or email (partial match)
          schema:
            type: string
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions

  /v1/users/{id}:
    get:
      operationId: getUserById
      summary: Get user by ID (Admin)
      description: Requires ADMIN_OFFICER or SUPER_ADMIN role.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions

  /v1/users/{id}/status:
    patch:
      operationId: updateUserStatus
      summary: Update user account status (Super Admin)
      description: |
        Changes the account status of any user.
        Requires SUPER_ADMIN role.
        All refresh tokens are revoked when suspending or deactivating an account.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
